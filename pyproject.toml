[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "pesaguard-security-assessment"
version = "0.1.0"
description = "Permission-first security assessment toolkit"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13.7,<14", "defusedxml>=0.7.1,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "bandit>=1.7,<2"]
[project.scripts]
pg-assess = "pg_assess.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/pg_assess"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
